# =============================================================
#  NotificadorPDV - configuração
#  Este ficheiro é lido no arranque. Fica ao lado do .jar.
# =============================================================

# --- Ligação ao MySQL do TagComercio --------------------------
# Instalação detectada: C:\MySQL (MySQL 5.5.27), base "tagcomercio".
db.host=127.0.0.1
db.porta=3306
db.base=tagcomercio
db.usuario=root
db.senha=

# --- Agendamento ----------------------------------------------
# Intervalo entre verificações (minutos) e atraso da 1ª execução (segundos).
agendador.intervalo_minutos=60
agendador.atraso_inicial_segundos=10

# --- Estoque baixo --------------------------------------------
estoque.ativo=true
# true = ignora produtos com min_estoque = 0 (produtos sem controlo de mínimo,
# que com estoque 0 também satisfazem "estoque <= min_estoque").
estoque.ignorar_minimo_zero=false
# Produtos marcados como inactivos no TagComercio (inativo=1) já são sempre excluídos.
# Para excluir também produtos "parados" (sem nenhuma venda nos últimos N dias),
# indique N aqui. 0 = desligado.
estoque.ignorar_sem_venda_dias=0

# --- Cobrança (clientes devendo) ------------------------------
# Lê as parcelas vencidas e não pagas do contas a receber (cad_lancamentos).
cobranca.ativo=true
# Faixas de atraso em dias. A última vira "90+ dias".
cobranca.faixas=15,30,45,60,75,90
# Modos de lançamento que NÃO são dívida do cliente (6 = cartão débito,
# 7 = cartão crédito: ficam pendentes até conciliar com a operadora).
cobranca.modos_ignorados=6,7
# Clientes a ignorar (ids de cad_clientes, separados por vírgula).
# 80 = "BALCÃO" (cliente genérico do caixa, não é uma pessoa a cobrar).
cobranca.clientes_ignorados=80

# --- Sugestões de compra (análise de vendas) ------------------
# Compara as vendas dos últimos 30 dias com os 60 anteriores e o estoque atual.
compras.ativo=true
# Quantos dias de venda o estoque deve cobrir após a compra.
compras.cobertura_alvo_dias=30
# Sugere AUMENTAR se o estoque durar menos que isto.
compras.cobertura_minima_dias=10
# Sugere REDUZIR se o estoque durar mais que isto.
compras.cobertura_excesso_dias=120
# Variação de vendas (%) considerada subida/queda relevante.
compras.tendencia_pct=30
# Mínimo de vendas em 90 dias para sugerir aumento (evita ruído).
compras.min_vendas_90_dias=3
# Só sugere REDUZIR se houver pelo menos este valor (R$) parado em estoque.
compras.valor_minimo_parado=50

# --- Mais vendidos ---------------------------------------------
# Mais vendidos = produtos que somam os primeiros N% do faturamento
# dos últimos 90 dias (curva A).
compras.mais_vendidos_pct=80
# E têm de vender com frequência: pelo menos N vendas em 90 dias
# (12 = cerca de uma por semana). Evita contar um item caro vendido 1 vez.
compras.mais_vendidos_min_vendas=12
# Para os mais vendidos, avisa quando o estoque estiver no mínimo
# cadastrado no TagComercio ou for chegar nele dentro de N dias.
compras.aviso_antes_minimo_dias=7

# --- Época do ano (sazonalidade pelo histórico de vendas) ------
# Olha os próximos 2 meses e compara com o que o produto vendeu nesses
# mesmos meses nos anos anteriores (ex.: chuveiro em mai-jun).
# Fator para considerar época de alta (1.4 = vende 40% acima do normal).
# A época de baixa é o inverso (1/1.4 = ~30% abaixo do normal).
compras.sazonal_fator=1.4
# O padrão tem de se repetir em pelo menos N anos diferentes.
compras.sazonal_min_anos=3
# Mínimo de vendas do produto nesses meses (somando todos os anos).
compras.sazonal_min_vendas=10
# Simular outra data (dd/mm/aaaa), ex.: 15/04/2025 para ver o que comprar
# antes do inverno. Vazio = automático (último dia com vendas).
compras.data_referencia=

# --- Histórico (Central de Notificações) ----------------------
# Ficheiro onde ficam gravadas todas as notificações emitidas.
historico.arquivo=historico_notificacoes.tsv
# Registos mais antigos que isto são apagados no arranque.
historico.dias_retencao=180

# --- Ecrã -----------------------------------------------------
# Máximo de linhas mostradas no balão do tray (o resto fica na janela de detalhes).
notificacao.max_linhas_balao=5

# --- Integrações futuras (ainda não implementadas) ------------
whatsapp.ativo=false
ia.ativo=false
